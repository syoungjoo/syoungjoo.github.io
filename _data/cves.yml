  - year: 2024
    items:
      - id: CVE-2024-54531
        url: https://nvd.nist.gov/vuln/detail/CVE-2024-54531
        title: KASLR Bypass in macOS for Apple Silicon
        tag: kbypass
        tag_label: KASLR Bypass
        reporter: Hyerean Jang
        category: Kernel / microarchitecture
        desc: |
          A memory-handling issue in macOS Sequoia (&lt; 15.2) that allows an
          application to bypass kernel address space layout randomization
          (KASLR). The flaw was reported to Apple and mitigated in macOS
          Sequoia 15.2 through improved memory handling. CVSS 5.5.
        publication:
          text: |
            Hyerean Jang, Taehun Kim, Youngjoo Shin.
            *"SysBumps: Exploiting Speculative Execution in System Calls for
            Breaking KASLR in macOS for Apple Silicon."*
            ACM CCS 2024 — also presented at Black Hat Europe 2024.
          links:
            - { label: "[lab publications]", url: "/publications/", relative: true }
            - { label: "[code]", url: "https://github.com/koreacsl/SysBumps" }

